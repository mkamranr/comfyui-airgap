; =============================================================================
;  ComfyUI-Manager — air-gapped configuration
; =============================================================================
;  Baked into /opt/comfy-defaults/user/__manager/config.ini and seeded into the
;  bind-mounted ./user directory by entrypoint.sh on every start.
;
;  network_mode = offline is the critical line. In the default "public" mode
;  Manager tries to fetch its node database from GitHub during ComfyUI startup;
;  with no route to the internet that becomes a long stall and a wall of
;  connection errors in the log before the server finally comes up.
;
;  Consequence, accepted deliberately: Manager's install/update/uninstall
;  buttons do nothing useful on the air-gapped host. Adding a node means
;  editing custom_nodes.txt and rebuilding on the internet machine.
; =============================================================================
[default]
network_mode = offline
bypass_ssl = True
file_logging = False

; Never let Manager try to self-update or re-fetch its channel list at startup.
default_cache_as_channel_url = False
update_policy = none

; Manager's own security gate. 'normal' permits local operations while still
; blocking the risky remote-install paths that cannot work here anyway.
security_level = normal

; Cosmetic defaults.
preview_method = auto
component_policy = workflow
